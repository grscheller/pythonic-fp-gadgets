name: Deploy Sphinx last release and devel docs

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  RELEASE: '4.6.0'
  DEVEL: '6.0.0'
  PYTHON: '3.14'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ env.PYTHON }}
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Build Release Docs
        env:
          UV_PROJECT_ENVIRONMENT: .venv-release
        run: |
          uv sync --only-group docs
          uv pip install --python .venv-release \
            "pythonic-fp-gadgets==${{ env.RELEASE }}"
          docs/gen_conf.py release ${{ env.RELEASE }} Gadgets gadgets > docs/source/conf.py
          .venv-release/bin/sphinx-build -b html docs/source docs/build/release

      - name: Build Development Docs
        env:
          UV_PROJECT_ENVIRONMENT: .venv-devel
        run: |
          docs/gen_conf.py devel ${{ env.DEVEL }} Gadgets gadgets > docs/source/conf.py
          uv run --no-default-groups --group docs -- \
            sphinx-build -b html docs/source docs/build/development

      - name: Build Root Landing Page
        run: |
          sed -e 's/@RELEASE@/${{ env.RELEASE }}/g' \
              -e 's/@DEVEL@/${{ env.DEVEL }}/g' \
              docs/gen_index.html > docs/build/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
        id: deployment
